name: Android debug APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use runner JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: npm ci
      - name: Check game logic
        run: npm run check && npm test
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build bundled debug APK
        run: npm run build:android:debug
      - name: Check Android lint
        run: node scripts/gradle.mjs :app:lintDebug
      - name: Upload debug APK and lint reports
        uses: actions/upload-artifact@v4
        with:
          name: dol-genba-v1.4-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 14
